name: macOS preview packages

on:
  workflow_dispatch:
    inputs:
      verify_models:
        description: "Also prepare and run real StartLux 0.8B and local Kokoro WAV synthesis (downloads about 1.3 GB)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Build bundled Android preview
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          require-lockfile: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare fixed Android tools
        shell: pwsh
        run: |
          & "$env:ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat" "platforms;android-35" "build-tools;35.0.0"
          if ($LASTEXITCODE -ne 0) { throw 'Android tools installation failed.' }
      - name: Build non-debug APK and validate downloadable artifact
        shell: pwsh
        run: |
          pnpm --filter @vivic/web build:mobile
          if ($LASTEXITCODE -ne 0) { throw 'Mobile UI build failed.' }
          ./apps/android/build.ps1 -AndroidSdk $env:ANDROID_HOME -JavaHome $env:JAVA_HOME -SkipWebBuild
          node scripts/stage-android-download.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Production APK validation failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Vivic-Android-preview-for-macOS
          include-hidden-files: true
          path: |
            .cache/android-build/artifacts/*.apk
            .cache/android-build/artifacts/*.apk.json
          if-no-files-found: error
          retention-days: 7
  package:
    name: macOS ${{ matrix.arch }} native package
    needs: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install native Node, pnpm and locked dependencies
        uses: pnpm/setup@v3
        with:
          runtime: node@24.21.0
          require-lockfile: true
          cache: true
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: "1"
      - name: Verify runner architecture and scripts
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          node --input-type=module -e "if(process.platform!=='darwin'||process.arch!==process.env.EXPECTED_ARCH)throw Error('Wrong native runner architecture')"
          node --check scripts/package-macos.mjs
          node --check scripts/package-macos-smoke.mjs
          node --check scripts/macos/Vivic-Launcher.mjs
          bash -n scripts/macos/Start-Vivic.command scripts/macos/Stop-Vivic.command scripts/macos/Install-Vivic.command
      - name: Retrieve matching production Android package
        uses: actions/download-artifact@v4
        with:
          name: Vivic-Android-preview-for-macOS
          path: .cache/android-build/artifacts
      - name: Build deployed package and verify native modules
        run: pnpm exec node scripts/package-macos.mjs --output .cache/vivic-macos-${{ matrix.arch }}
      - name: Verify installed API, process ownership and no credential copying
        run: node scripts/package-macos-smoke.mjs .cache/vivic-macos-${{ matrix.arch }}
      - name: Verify native managed StartLux and silent local TTS
        if: inputs.verify_models
        run: node scripts/verify-local-runtime.mjs --tts --cache .cache/local-runtime-smoke-${{ matrix.arch }}
      - name: Upload native runtime evidence
        if: inputs.verify_models && always()
        uses: actions/upload-artifact@v4
        with:
          name: Vivic-macOS-${{ matrix.arch }}-runtime-evidence
          path: |
            .cache/local-runtime-smoke-${{ matrix.arch }}/verification.json
            .cache/local-runtime-smoke-${{ matrix.arch }}/local-tts-*.wav
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload unsigned preview and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Vivic-macOS-${{ matrix.arch }}-preview
          path: |
            .cache/vivic-macos-${{ matrix.arch }}.zip
            .cache/vivic-macos-${{ matrix.arch }}.zip.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Upload smoke evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Vivic-macOS-${{ matrix.arch }}-failure
          path: |
            .cache/vivic-macos-${{ matrix.arch }}/runtime.err.log
            .cache/vivic-macos-${{ matrix.arch }}/runtime.out.log
            .cache/macos-smoke-*/result.json
          if-no-files-found: ignore
          retention-days: 7
