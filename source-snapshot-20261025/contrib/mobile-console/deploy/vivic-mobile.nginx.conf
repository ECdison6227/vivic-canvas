# Include inside the existing TLS server block. Provision the exact Origin list separately.
location = /vivic-remote { return 302 /vivic-remote/; }
location = /vivic-remote/relay {
    proxy_pass http://127.0.0.1:8793/relay;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    access_log off;
}
location = /vivic-remote/healthz { proxy_pass http://127.0.0.1:8793/healthz; }
location /vivic-remote/ {
    alias /opt/vivic-mobile/current/ui/;
    index index.html;
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy no-referrer;
}
