# Include inside an EXISTING dedicated HTTPS server block, only when publishing
# is authorized. The app requires its own origin rooted at / (no subpath).
# Do not add request bodies, Authorization, Cookie, or full query strings to logs.
location / {
    proxy_pass http://127.0.0.1:8790;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    # Preserve Origin, Sec-Fetch-*, and Cookie. Do not rewrite Set-Cookie.
    # Intent SSE and mobile's 20 second HTTPS polls share this transport.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_connect_timeout 5s;
    proxy_read_timeout 150s;
    proxy_send_timeout 150s;
    client_max_body_size 9m;
    # Session requests must never be retried against another isolated process.
    proxy_next_upstream off;
}
