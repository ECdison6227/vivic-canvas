server {
    listen 80;
    server_name vivic.edsionc.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/vivic-preview-acme; default_type text/plain; }
    location / { return 308 https://vivic.edsionc.top$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name vivic.edsionc.top;
    ssl_certificate /etc/letsencrypt/live/vivic-preview-20261025/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vivic-preview-20261025/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 24m;
    location = /downloads/Vivic-Remote.apk {
        alias /var/www/vivic-preview-downloads/Vivic-Remote-0.2.0.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="Vivic-Remote-0.2.0.apk"' always;
        add_header X-Content-Type-Options nosniff always;
        add_header Cache-Control "no-store" always;
    }
    access_log off;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 200s;
    }
    location = /api {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 200s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:18890;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 200s;
    }
    location = /__vivic/boot-error {
        access_log /var/log/nginx/vivic-startup-errors.log combined;
        add_header Cache-Control "no-store" always;
        return 204;
    }
    location ^~ /assets/ {
        root /opt/vivic-preview-20261025/frontend-current;
        try_files $uri =404;
        charset utf-8;
        include /opt/vivic-preview-20261025/releases/stable-background-20261029-1/frontend-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location / {
        root /opt/vivic-preview-20261025/frontend-current;
        try_files $uri $uri/ /index.html;
        charset utf-8;
        include /opt/vivic-preview-20261025/releases/stable-background-20261029-1/frontend-headers.conf;
        add_header Cache-Control "no-store" always;
    }
}
